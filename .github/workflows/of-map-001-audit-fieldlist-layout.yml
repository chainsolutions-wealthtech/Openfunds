name: OF-MAP-001 Audit archived Field List layout

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - ".github/workflows/of-map-001-audit-fieldlist-layout.yml"

permissions:
  contents: read

jobs:
  audit-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PDF_PATH: data/openfunds/official/v2.13.0/openfunds_fields_v2.13.0.pdf
      SHA_PATH: data/openfunds/official/v2.13.0/openfunds_fields_v2.13.0.pdf.sha256
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: architecture/africafunds-country-indicators-v0.1

      - name: Verify checksum before any parse audit
        run: |
          set -euo pipefail
          expected="$(cut -d' ' -f1 "$SHA_PATH")"
          actual="$(sha256sum "$PDF_PATH" | cut -d' ' -f1)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$expected" = "$actual"
          test "$actual" = "40b562a10e92cf809449302e8c9eacf785f5c8a66ff644d1a5c36fc4380cebb4"

      - name: Install deterministic PDF text tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Extract layout text to ephemeral workspace
        run: |
          set -euo pipefail
          pdftotext -layout "$PDF_PATH" /tmp/openfunds_v2_13_0.txt
          test -s /tmp/openfunds_v2_13_0.txt
          echo "TEXT_BYTES=$(stat -c '%s' /tmp/openfunds_v2_13_0.txt)"
          echo "TEXT_LINES=$(wc -l < /tmp/openfunds_v2_13_0.txt)"

      - name: Audit actual field-record headers
        shell: python
        run: |
          import re
          from collections import Counter
          from pathlib import Path

          lines = Path('/tmp/openfunds_v2_13_0.txt').read_text(encoding='utf-8').splitlines()
          header_marker = re.compile(r'^\s*OF-ID\s+')
          strict_header = re.compile(r'^\s*OF-ID\s+(OF[A-Z]{2}\d{6})\s+Field Name\s+(.+?)\s*$')
          broad_header = re.compile(r'^\s*OF-ID\s+(\S+)\s+Field Name\s+(.+?)\s*$')

          marker_lines = []
          strict_records = []
          broad_records = []
          nonmatching = []
          for lineno, line in enumerate(lines, start=1):
              if not header_marker.match(line):
                  continue
              marker_lines.append((lineno, line))
              broad = broad_header.match(line)
              strict = strict_header.match(line)
              if broad:
                  broad_records.append((lineno, broad.group(1), broad.group(2)))
              if strict:
                  strict_records.append((lineno, strict.group(1), strict.group(2)))
              else:
                  nonmatching.append((lineno, line))

          ids = [record[1] for record in strict_records]
          counts = Counter(ids)
          duplicates = {key: value for key, value in counts.items() if value != 1}
          prefixes = Counter(value[:4] for value in ids)

          print('HEADER_MARKER_LINES', len(marker_lines))
          print('BROAD_HEADER_RECORDS', len(broad_records))
          print('STRICT_2LETTER_6DIGIT_RECORDS', len(strict_records))
          print('STRICT_UNIQUE_IDS', len(set(ids)))
          print('STRICT_DUPLICATES', duplicates)
          print('STRICT_PREFIX_COUNTS', dict(sorted(prefixes.items())))
          print('NONMATCHING_HEADER_LINES', len(nonmatching))
          for lineno, line in nonmatching[:100]:
              print(f'NONMATCHING {lineno}: {line}')
          print('FIRST_20_STRICT_RECORDS')
          for item in strict_records[:20]:
              print(item)
          print('LAST_20_STRICT_RECORDS')
          for item in strict_records[-20:]:
              print(item)

          if broad_records:
              broad_ids = Counter(record[1] for record in broad_records)
              print('BROAD_ID_LENGTHS', dict(sorted(Counter(map(len, broad_ids)).items())))
              print('BROAD_NON_STRICT_IDS')
              strict_id_set = set(ids)
              for value in sorted(broad_ids):
                  if value not in strict_id_set:
                      print(value, broad_ids[value])

      - name: Audit field-record section labels around strict headers
        shell: python
        run: |
          import re
          from collections import Counter
          from pathlib import Path

          lines = Path('/tmp/openfunds_v2_13_0.txt').read_text(encoding='utf-8').splitlines()
          strict_header = re.compile(r'^\s*OF-ID\s+(OF[A-Z]{2}\d{6})\s+Field Name\s+(.+?)\s*$')
          indexes = [i for i, line in enumerate(lines) if strict_header.match(line)]
          labels = Counter()
          samples = []
          for pos, start in enumerate(indexes):
              end = indexes[pos + 1] if pos + 1 < len(indexes) else len(lines)
              block = lines[start:end]
              for line in block[1:]:
                  match = re.match(r'^\s*(Field Tags|Field Level|Data Type|Description|Values|Example|Introduced / Revoked)\b', line)
                  if match:
                      labels[match.group(1)] += 1
              if len(samples) < 5:
                  samples.append(block[:16])
          print('STRICT_RECORD_COUNT', len(indexes))
          print('SECTION_LABEL_OCCURRENCES', dict(sorted(labels.items())))
          for number, block in enumerate(samples, start=1):
              print(f'--- RECORD_SAMPLE_{number} ---')
              for line in block:
                  print(line)

      - name: Assert archive was not modified
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 -uall)"
