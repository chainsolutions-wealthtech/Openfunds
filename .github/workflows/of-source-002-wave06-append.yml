name: OF-SOURCE-002 Wave 06 Governed Append

on:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - ".github/workflows/of-source-002-wave06-append.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: of-source-002-wave06-governed-append
  cancel-in-progress: false

jobs:
  append-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: architecture/africafunds-country-indicators-v0.1
          fetch-depth: 0

      - name: Append exact governed Wave 06 allowlist
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          ref = Path("data/reference")
          org_path = ref / "ORGANIZATIONS.csv"
          role_path = ref / "ORGANIZATION_SCOPE_ROLES.csv"

          organizations = [
              "CBL_LIBERIA;CENTRAL_BANK;BANQUE CENTRALE DU LIBERIA;CENTRAL BANK OF LIBERIA;CBL;LIBERIA;LIBERIA;;https://www.cbl.org.lr/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "LISGIS;STATISTICS_OFFICE;INSTITUT LIBERIEN DES STATISTIQUES ET SERVICES GEO-INFORMATION;LIBERIA INSTITUTE OF STATISTICS AND GEO-INFORMATION SERVICES;LISGIS;LIBERIA;LIBERIA;;https://lisgis.gov.lr/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "CBG;CENTRAL_BANK;BANQUE CENTRALE DE GAMBIE;CENTRAL BANK OF THE GAMBIA;CBG;GAMBIE;GAMBIE;;https://www.cbg.gm/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "GBOS_GAMBIA;STATISTICS_OFFICE;BUREAU DES STATISTIQUES DE GAMBIE;GAMBIA BUREAU OF STATISTICS;GBoS;GAMBIE;GAMBIE;;https://gambia.gov.gm/gambia-bureau-of-statistics/;;1;0;1;;;VALIDATED;OFFICIAL_GOVERNMENT_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "BSL;CENTRAL_BANK;BANQUE DE SIERRA LEONE;BANK OF SIERRA LEONE;BSL;SIERRA_LEONE;SIERRA_LEONE;;https://bsl.gov.sl/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "STATS_SL;STATISTICS_OFFICE;STATISTIQUES SIERRA LEONE;STATISTICS SIERRA LEONE;Stats SL;SIERRA_LEONE;SIERRA_LEONE;;https://www.statistics.sl/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "BCRG;CENTRAL_BANK;BANQUE CENTRALE DE LA REPUBLIQUE DE GUINEE;CENTRAL BANK OF THE REPUBLIC OF GUINEA;BCRG;GUINEE;GUINEE;;https://www.bcrg.gn/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "INS_GUINEE;STATISTICS_OFFICE;INSTITUT NATIONAL DE LA STATISTIQUE DE GUINEE;NATIONAL INSTITUTE OF STATISTICS GUINEA;INS;GUINEE;GUINEE;;https://www.stat-guinee.org/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
          ]

          roles = [
              ("CBL_LIBERIA", "CENTRAL_BANK", "LIBERIA", "COUNTRY", "PRIMARY_CENTRAL_BANK"),
              ("LISGIS", "STATISTICS_OFFICE", "LIBERIA", "COUNTRY", "PRIMARY_STATISTICS_OFFICE"),
              ("CBG", "CENTRAL_BANK", "GAMBIE", "COUNTRY", "PRIMARY_CENTRAL_BANK"),
              ("GBOS_GAMBIA", "STATISTICS_OFFICE", "GAMBIE", "COUNTRY", "PRIMARY_STATISTICS_OFFICE"),
              ("BSL", "CENTRAL_BANK", "SIERRA_LEONE", "COUNTRY", "PRIMARY_CENTRAL_BANK"),
              ("STATS_SL", "STATISTICS_OFFICE", "SIERRA_LEONE", "COUNTRY", "PRIMARY_STATISTICS_OFFICE"),
              ("BCRG", "CENTRAL_BANK", "GUINEE", "COUNTRY", "PRIMARY_CENTRAL_BANK"),
              ("INS_GUINEE", "STATISTICS_OFFICE", "GUINEE", "COUNTRY", "PRIMARY_STATISTICS_OFFICE"),
          ]

          expected_org_codes = {line.split(";", 1)[0] for line in organizations}
          with org_path.open("r", encoding="utf-8", newline="") as handle:
              existing_org_rows = list(csv.DictReader(handle, delimiter=";"))
          existing_org_codes = {row["ORGANIZATION_CODE"] for row in existing_org_rows}
          present_orgs = expected_org_codes & existing_org_codes
          if present_orgs and present_orgs != expected_org_codes:
              raise SystemExit(f"Partial Wave 06 organization state; refusing mutation: {sorted(present_orgs)}")

          with role_path.open("r", encoding="utf-8", newline="") as handle:
              existing_role_rows = list(csv.DictReader(handle, delimiter=";"))
          existing_role_keys = {
              (row["ORGANIZATION_CODE"], row["ROLE_CODE"], row["SCOPE_ENTITY_CODE"], row["SCOPE_ENTITY_TYPE"])
              for row in existing_role_rows
          }
          expected_role_keys = {(org, role, scope, scope_type) for org, role, scope, scope_type, _ in roles}
          present_roles = expected_role_keys & existing_role_keys
          if present_roles and present_roles != expected_role_keys:
              raise SystemExit(f"Partial Wave 06 role state; refusing mutation: {sorted(present_roles)}")

          if present_orgs == expected_org_codes and present_roles == expected_role_keys:
              print("Wave 06 allowlist already fully present; no append needed")
          else:
              if present_orgs or present_roles:
                  raise SystemExit("Wave 06 state is not atomically absent or complete; refusing mutation")
              with org_path.open("a", encoding="utf-8", newline="") as handle:
                  for line in organizations:
                      handle.write(line + "\n")
              with role_path.open("a", encoding="utf-8", newline="") as handle:
                  for org, role, scope, scope_type, relationship_role in roles:
                      handle.write(
                          f"{org};{role};{scope};{scope_type};{relationship_role};1;;;VALIDATED;OFFICIAL_ROLE_VERIFIED_2026_08_17\n"
                      )
              print(f"Appended {len(organizations)} organizations and {len(roles)} roles")
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate registry with Python 3.11
        run: |
          python scripts/validate_institutional_registry.py --check
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registry with Python 3.12
        run: |
          python scripts/validate_institutional_registry.py --check
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06

      - name: Assert exact Wave 06 post-state
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          ref = Path("data/reference")
          with (ref / "AFRICA_COUNTRIES.csv").open(encoding="utf-8", newline="") as h:
              countries = list(csv.DictReader(h, delimiter=";"))
          with (ref / "ORGANIZATIONS.csv").open(encoding="utf-8", newline="") as h:
              organizations = list(csv.DictReader(h, delimiter=";"))
          with (ref / "ORGANIZATION_SCOPE_ROLES.csv").open(encoding="utf-8", newline="") as h:
              roles = list(csv.DictReader(h, delimiter=";"))

          org_status = Counter(row["VALIDATION_STATUS"] for row in organizations)
          role_status = Counter(row["VALIDATION_STATUS"] for row in roles)
          covered = {row["PRIMARY_COUNTRY_CODE"] for row in organizations if row["PRIMARY_COUNTRY_CODE"]}

          assert len(countries) == 54, len(countries)
          assert len(organizations) == 116, len(organizations)
          assert org_status == Counter({"VALIDATED": 96, "PENDING": 20}), org_status
          assert len(covered) == 28, len(covered)
          assert len(roles) == 174, len(roles)
          assert role_status == Counter({"VALIDATED": 130, "PENDING": 44}), role_status
          print("Wave 06 post-state verified: 116 orgs / 28 countries / 174 roles")
          PY

      - name: Commit only the two governed registries
        shell: bash
        run: |
          if git diff --quiet -- data/reference/ORGANIZATIONS.csv data/reference/ORGANIZATION_SCOPE_ROLES.csv; then
            echo "No Wave 06 registry change to commit"
            exit 0
          fi
          git status --short
          unexpected_files="$(git status --short | awk '$2 != "data/reference/ORGANIZATIONS.csv" && $2 != "data/reference/ORGANIZATION_SCOPE_ROLES.csv" {count++} END {print count+0}')"
          test "$unexpected_files" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/ORGANIZATIONS.csv data/reference/ORGANIZATION_SCOPE_ROLES.csv
          git commit -m "data(source): add verified wave 06 institutions"
          git push origin HEAD:architecture/africafunds-country-indicators-v0.1
