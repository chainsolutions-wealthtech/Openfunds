name: Institutional Registry

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - "data/reference/AFRICA_COUNTRIES.csv"
      - "data/reference/ORGANIZATIONS.csv"
      - "data/reference/ORGANIZATION_ROLES.csv"
      - "data/reference/ORGANIZATION_SCOPE_ROLES.csv"
      - "data/reference/SOURCE_ENDPOINTS.csv"
      - "scripts/validate_institutional_registry.py"
      - "tests/test_institutional_registry.py"
      - "tests/test_institutional_registry_wave05.py"
      - "tests/test_institutional_registry_wave06.py"
      - "tests/test_institutional_registry_wave07.py"
      - "tests/test_institutional_registry_wave08.py"
      - "tests/test_institutional_registry_wave09.py"
      - ".github/workflows/institutional-registry.yml"
  pull_request:
    paths:
      - "data/reference/AFRICA_COUNTRIES.csv"
      - "data/reference/ORGANIZATIONS.csv"
      - "data/reference/ORGANIZATION_ROLES.csv"
      - "data/reference/ORGANIZATION_SCOPE_ROLES.csv"
      - "data/reference/SOURCE_ENDPOINTS.csv"
      - "scripts/validate_institutional_registry.py"
      - "tests/test_institutional_registry.py"
      - "tests/test_institutional_registry_wave05.py"
      - "tests/test_institutional_registry_wave06.py"
      - "tests/test_institutional_registry_wave07.py"
      - "tests/test_institutional_registry_wave08.py"
      - "tests/test_institutional_registry_wave09.py"
      - ".github/workflows/institutional-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    name: validate-institutional-registry (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run institutional registry contract tests
        run: |
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06
          python -m unittest -v tests.test_institutional_registry_wave07
          python -m unittest -v tests.test_institutional_registry_wave08
          python -m unittest -v tests.test_institutional_registry_wave09
