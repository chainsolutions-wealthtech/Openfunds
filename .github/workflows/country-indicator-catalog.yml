name: Country Indicator Catalog

on:
  pull_request:
    paths:
      - 'data/indicator_catalog/**'
      - 'docs/04_DATA_GOVERNANCE/indicator_catalog/**'
      - 'docs/04_DATA_GOVERNANCE/COUNTRY_INDICATOR_CATALOG_V1.md'
      - 'docs/01_ARCHITECTURE/ADR-032_COUNTRY_INDICATOR_CATALOG_MIRROR_FIRST.md'
      - 'scripts/country_indicator_catalog.py'
      - 'scripts/generate_country_indicator_catalog.py'
      - 'tests/test_country_indicator_catalog.py'
      - 'schemas/reference/016_country_indicator_catalog.sql'
      - 'migrations/manifest.json'
      - '.github/workflows/country-indicator-catalog.yml'
  push:
    paths:
      - 'data/indicator_catalog/**'
      - 'docs/04_DATA_GOVERNANCE/indicator_catalog/**'
      - 'docs/04_DATA_GOVERNANCE/COUNTRY_INDICATOR_CATALOG_V1.md'
      - 'docs/01_ARCHITECTURE/ADR-032_COUNTRY_INDICATOR_CATALOG_MIRROR_FIRST.md'
      - 'scripts/country_indicator_catalog.py'
      - 'scripts/generate_country_indicator_catalog.py'
      - 'tests/test_country_indicator_catalog.py'
      - 'schemas/reference/016_country_indicator_catalog.sql'
      - 'migrations/manifest.json'
      - '.github/workflows/country-indicator-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-country-indicator-catalog:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate committed governed authoring package
        run: python scripts/generate_country_indicator_catalog.py --check-authoring
      - name: Generate deterministic review and SQL artifacts
        run: python scripts/generate_country_indicator_catalog.py --generate-derived
      - name: Run country indicator catalogue contract tests
        run: python -m unittest -v tests.test_country_indicator_catalog
      - name: Verify byte-identical regeneration
        run: python scripts/generate_country_indicator_catalog.py --check-derived
      - name: Upload generated review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: country-indicator-catalog-py${{ matrix.python-version }}
          path: build/indicator_catalog/
          if-no-files-found: error
      - name: Commit frozen SQL and checksum manifest
        if: github.event_name == 'push' && matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            data/indicator_catalog/COUNTRY_INDICATOR_CATALOG_MANIFEST_V1.json
            schemas/reference/016_country_indicator_catalog.sql
          )
          if [ -z "$(git status --porcelain -- "${tracked[@]}")" ]; then
            echo "Frozen derived outputs already committed and byte-identical."
            exit 0
          fi
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced during derived freeze: expected $GITHUB_SHA, got $remote_sha" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${tracked[@]}"
          git commit -m "data(catalog): freeze deterministic D00-D17 outputs [OF-DATA-003]"
          git push origin "HEAD:$GITHUB_REF_NAME"
