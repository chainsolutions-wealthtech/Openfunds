name: OF-SOURCE-002 Wave 07 Governed Append

on:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - ".github/workflows/of-source-002-wave07-append.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: of-source-002-wave07-governed-append
  cancel-in-progress: false

jobs:
  append-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: architecture/africafunds-country-indicators-v0.1
          fetch-depth: 0

      - name: Append exact governed Wave 07 allowlist
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          ref = Path("data/reference")
          org_path = ref / "ORGANIZATIONS.csv"
          role_path = ref / "ORGANIZATION_SCOPE_ROLES.csv"

          organizations = [
              "INSTAD_BENIN;STATISTICS_OFFICE;INSTITUT NATIONAL DE LA STATISTIQUE ET DE LA DEMOGRAPHIE DU BENIN;NATIONAL INSTITUTE OF STATISTICS AND DEMOGRAPHY BENIN;INStaD;BENIN;BENIN;;https://www.instad.bj/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "INSD_BURKINA;STATISTICS_OFFICE;INSTITUT NATIONAL DE LA STATISTIQUE ET DE LA DEMOGRAPHIE DU BURKINA FASO;NATIONAL INSTITUTE OF STATISTICS AND DEMOGRAPHY BURKINA FASO;INSD;BURKINA_FASO;BURKINA_FASO;;https://www.insd.bf/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "ANSTAT_CIV;STATISTICS_OFFICE;AGENCE NATIONALE DE LA STATISTIQUE DE COTE D IVOIRE;NATIONAL STATISTICS AGENCY COTE D IVOIRE;ANStat;COTE_DIVOIRE;COTE_DIVOIRE;;https://www.anstat.ci/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "INE_GUINEE_BISSAU;STATISTICS_OFFICE;INSTITUT NATIONAL DE STATISTIQUE DE GUINEE BISSAU;INSTITUTO NACIONAL DE ESTATISTICA DA GUINE BISSAU;INE-GB;GUINEE_BISSAU;GUINEE_BISSAU;;https://stat-guinebissau.com/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "INSTAT_MALI;STATISTICS_OFFICE;INSTITUT NATIONAL DE LA STATISTIQUE DU MALI;NATIONAL INSTITUTE OF STATISTICS MALI;INSTAT;MALI;MALI;;https://www.instat-mali.org/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "INS_NIGER;STATISTICS_OFFICE;INSTITUT NATIONAL DE LA STATISTIQUE DU NIGER;NATIONAL INSTITUTE OF STATISTICS NIGER;INS;NIGER;NIGER;;https://www.stat-niger.org/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "ANSD_SENEGAL;STATISTICS_OFFICE;AGENCE NATIONALE DE LA STATISTIQUE ET DE LA DEMOGRAPHIE DU SENEGAL;NATIONAL AGENCY OF STATISTICS AND DEMOGRAPHY SENEGAL;ANSD;SENEGAL;SENEGAL;;https://www.ansd.sn/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
              "INSEED_TOGO;STATISTICS_OFFICE;INSTITUT NATIONAL DE LA STATISTIQUE ET DES ETUDES ECONOMIQUES ET DEMOGRAPHIQUES DU TOGO;NATIONAL INSTITUTE OF STATISTICS ECONOMIC AND DEMOGRAPHIC STUDIES TOGO;INSEED;TOGO;TOGO;;https://inseed.tg/;;1;0;1;;;VALIDATED;OFFICIAL_IDENTITY_AND_ROLE_VERIFIED_2026_08_17",
          ]
          roles = [
              ("INSTAD_BENIN", "BENIN"),
              ("INSD_BURKINA", "BURKINA_FASO"),
              ("ANSTAT_CIV", "COTE_DIVOIRE"),
              ("INE_GUINEE_BISSAU", "GUINEE_BISSAU"),
              ("INSTAT_MALI", "MALI"),
              ("INS_NIGER", "NIGER"),
              ("ANSD_SENEGAL", "SENEGAL"),
              ("INSEED_TOGO", "TOGO"),
          ]

          expected_org_codes = {line.split(";", 1)[0] for line in organizations}
          with org_path.open("r", encoding="utf-8", newline="") as handle:
              existing_org_rows = list(csv.DictReader(handle, delimiter=";"))
          existing_org_codes = {row["ORGANIZATION_CODE"] for row in existing_org_rows}
          present_orgs = expected_org_codes & existing_org_codes
          if present_orgs and present_orgs != expected_org_codes:
              raise SystemExit(f"Partial Wave 07 organization state; refusing mutation: {sorted(present_orgs)}")

          with role_path.open("r", encoding="utf-8", newline="") as handle:
              existing_role_rows = list(csv.DictReader(handle, delimiter=";"))
          existing_role_keys = {
              (row["ORGANIZATION_CODE"], row["ROLE_CODE"], row["SCOPE_ENTITY_CODE"], row["SCOPE_ENTITY_TYPE"])
              for row in existing_role_rows
          }
          expected_role_keys = {(org, "STATISTICS_OFFICE", country, "COUNTRY") for org, country in roles}
          present_roles = expected_role_keys & existing_role_keys
          if present_roles and present_roles != expected_role_keys:
              raise SystemExit(f"Partial Wave 07 role state; refusing mutation: {sorted(present_roles)}")

          if present_orgs == expected_org_codes and present_roles == expected_role_keys:
              print("Wave 07 allowlist already fully present; no append needed")
          else:
              if present_orgs or present_roles:
                  raise SystemExit("Wave 07 state is not atomically absent or complete; refusing mutation")
              with org_path.open("a", encoding="utf-8", newline="") as handle:
                  for line in organizations:
                      handle.write(line + "\n")
              with role_path.open("a", encoding="utf-8", newline="") as handle:
                  for org, country in roles:
                      handle.write(f"{org};STATISTICS_OFFICE;{country};COUNTRY;PRIMARY_STATISTICS_OFFICE;1;;;VALIDATED;OFFICIAL_ROLE_VERIFIED_2026_08_17\n")
              print(f"Appended {len(organizations)} organizations and {len(roles)} roles")
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate registry with Python 3.11
        run: |
          python scripts/validate_institutional_registry.py --check
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06
          python -m unittest -v tests.test_institutional_registry_wave07
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry with Python 3.12
        run: |
          python scripts/validate_institutional_registry.py --check
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06
          python -m unittest -v tests.test_institutional_registry_wave07

      - name: Assert exact Wave 07 post-state
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          ref = Path("data/reference")
          with (ref / "AFRICA_COUNTRIES.csv").open(encoding="utf-8", newline="") as h:
              countries = list(csv.DictReader(h, delimiter=";"))
          with (ref / "ORGANIZATIONS.csv").open(encoding="utf-8", newline="") as h:
              organizations = list(csv.DictReader(h, delimiter=";"))
          with (ref / "ORGANIZATION_SCOPE_ROLES.csv").open(encoding="utf-8", newline="") as h:
              roles = list(csv.DictReader(h, delimiter=";"))
          org_status = Counter(row["VALIDATION_STATUS"] for row in organizations)
          role_status = Counter(row["VALIDATION_STATUS"] for row in roles)
          covered = {row["PRIMARY_COUNTRY_CODE"] for row in organizations if row["PRIMARY_COUNTRY_CODE"]}
          assert len(countries) == 54
          assert len(organizations) == 124, len(organizations)
          assert org_status == Counter({"VALIDATED": 104, "PENDING": 20}), org_status
          assert len(covered) == 36, len(covered)
          assert len(roles) == 182, len(roles)
          assert role_status == Counter({"VALIDATED": 138, "PENDING": 44}), role_status
          print("Wave 07 post-state verified: 124 orgs / 36 countries / 182 roles")
          PY

      - name: Commit only the two governed registries
        shell: bash
        run: |
          if git diff --quiet -- data/reference/ORGANIZATIONS.csv data/reference/ORGANIZATION_SCOPE_ROLES.csv; then
            echo "No Wave 07 registry change to commit"
            exit 0
          fi
          git status --short
          unexpected_files="$(git status --short | awk '$2 != "data/reference/ORGANIZATIONS.csv" && $2 != "data/reference/ORGANIZATION_SCOPE_ROLES.csv" {count++} END {print count+0}')"
          test "$unexpected_files" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/ORGANIZATIONS.csv data/reference/ORGANIZATION_SCOPE_ROLES.csv
          git commit -m "data(source): add verified wave 07 UEMOA statistics institutions"
          git push origin HEAD:architecture/africafunds-country-indicators-v0.1
