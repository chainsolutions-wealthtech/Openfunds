name: OF-DATA-003 Documentation Closeout

on:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - 'scripts/finalize_of_data_003_documentation.py'
      - '.github/workflows/of-data-003-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact technical ancestry and ephemeral diff
        shell: bash
        run: |
          set -euo pipefail
          expected='0777afffad950e779234ef09f3f2b9031ec41ce7'
          git merge-base --is-ancestor "$expected" HEAD
          actual="$(git diff --name-only "$expected"..HEAD | sort)"
          expected_paths="$(printf '%s\n' '.github/workflows/of-data-003-closeout.yml' 'scripts/finalize_of_data_003_documentation.py' | sort)"
          if [ "$actual" != "$expected_paths" ]; then
            echo 'Unexpected changes after validated technical HEAD:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Prepare and verify documentation closeout
        run: python scripts/finalize_of_data_003_documentation.py

      - name: Remove ephemeral closeout mechanism
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/finalize_of_data_003_documentation.py
          rm .github/workflows/of-data-003-closeout.yml

      - name: Verify exact allowlist
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/of-data-003-closeout.yml' \
            '00_START_HERE.md' \
            'AGENTS.md' \
            'CHANGELOG.md' \
            'CURRENT_ITERATION.md' \
            'DECISIONS.md' \
            'HANDOFF.md' \
            'LOOP_STATE.md' \
            'NEXT_ACTION.md' \
            'SOURCE_OF_TRUTH.md' \
            'STATUS.md' \
            'SUIVI.md' \
            'TODO.md' \
            'WORK_LOG.md' \
            'docs/00_PROJECT/OF_DATA_003_COMPLETION_20260811.md' \
            'docs/01_ARCHITECTURE/ADR-032_COUNTRY_INDICATOR_CATALOG_MIRROR_FIRST.md' \
            'docs/04_DATA_GOVERNANCE/Africa_Country_Indicator_Framework_v0.1.md' \
            'docs/04_DATA_GOVERNANCE/COUNTRY_INDICATOR_CATALOG_V1.md' \
            'docs/superpowers/plans/2026-08-11-of-data-003-country-indicator-catalog.md' \
            'scripts/finalize_of_data_003_documentation.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected closeout diff:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit documentation closeout fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced during closeout: expected $GITHUB_SHA got $remote_sha" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(data): close governed D00-D17 catalogue [OF-DATA-003]'
          git push origin "HEAD:$GITHUB_REF_NAME"
