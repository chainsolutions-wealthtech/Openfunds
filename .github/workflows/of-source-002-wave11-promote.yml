name: OF-SOURCE-002 Wave 11 Exchange Role Promotion

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - ".github/workflows/of-source-002-wave11-promote.yml"

permissions:
  contents: write

jobs:
  promote-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact governed branch
        uses: actions/checkout@v4
        with:
          ref: architecture/africafunds-country-indicators-v0.1
          fetch-depth: 0

      - name: Promote only the 3 exact existing Wave 11 rows
        shell: python
        run: |
          import csv
          from pathlib import Path

          path = Path("data/reference/ORGANIZATION_SCOPE_ROLES.csv")
          key_fields = ("ORGANIZATION_CODE", "ROLE_CODE", "SCOPE_ENTITY_CODE", "SCOPE_ENTITY_TYPE")
          selected = {
              ("EGX", "STOCK_EXCHANGE", "EGYPTE", "COUNTRY"),
              ("GSE", "STOCK_EXCHANGE", "GHANA", "COUNTRY"),
              ("NGX", "STOCK_EXCHANGE", "NIGERIA", "COUNTRY"),
          }

          with path.open("r", encoding="utf-8", newline="") as handle:
              reader = csv.DictReader(handle, delimiter=";")
              fieldnames = list(reader.fieldnames or [])
              rows = list(reader)

          if len(rows) != 199:
              raise SystemExit(f"unexpected pre-state row count: {len(rows)}")

          seen = set()
          changed = 0
          for row in rows:
              key = tuple(row[field] for field in key_fields)
              if key not in selected:
                  continue
              if key in seen:
                  raise SystemExit(f"duplicate selected key: {key}")
              seen.add(key)
              if row["VALIDATION_STATUS"] != "PENDING":
                  raise SystemExit(f"selected row is not PENDING before promotion: {key} -> {row['VALIDATION_STATUS']}")
              row["VALIDATION_STATUS"] = "VALIDATED"
              row["SOURCE_NOTE"] = "OFFICIAL_ROLE_VERIFIED_2026_08_17_WAVE11"
              changed += 1

          missing = selected - seen
          if missing:
              raise SystemExit(f"missing selected rows: {sorted(missing)}")
          if changed != 3:
              raise SystemExit(f"expected 3 promotions, got {changed}")

          with path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, delimiter=";", lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)

      - name: Assert only status and source note changed on the 3 selected rows
        shell: python
        run: |
          import csv, subprocess
          from pathlib import Path

          path = "data/reference/ORGANIZATION_SCOPE_ROLES.csv"
          current = Path(path).read_text(encoding="utf-8")
          previous = subprocess.check_output(["git", "show", f"HEAD:{path}"], text=True)

          def parse(text):
              return list(csv.DictReader(text.splitlines(), delimiter=";"))

          old_rows, new_rows = parse(previous), parse(current)
          if len(old_rows) != 199 or len(new_rows) != 199:
              raise SystemExit("role row count drift")

          key_fields = ("ORGANIZATION_CODE", "ROLE_CODE", "SCOPE_ENTITY_CODE", "SCOPE_ENTITY_TYPE")
          allowed_fields = {"VALIDATION_STATUS", "SOURCE_NOTE"}
          selected = {
              ("EGX", "STOCK_EXCHANGE", "EGYPTE", "COUNTRY"),
              ("GSE", "STOCK_EXCHANGE", "GHANA", "COUNTRY"),
              ("NGX", "STOCK_EXCHANGE", "NIGERIA", "COUNTRY"),
          }
          old = {tuple(r[f] for f in key_fields): r for r in old_rows}
          new = {tuple(r[f] for f in key_fields): r for r in new_rows}
          if set(old) != set(new):
              raise SystemExit("row identity drift")

          changed_keys = []
          for key in old:
              diffs = {field for field in old[key] if old[key][field] != new[key][field]}
              if diffs:
                  if key not in selected:
                      raise SystemExit(f"unexpected changed row: {key}")
                  if not diffs <= allowed_fields:
                      raise SystemExit(f"forbidden field changes for {key}: {sorted(diffs)}")
                  changed_keys.append(key)
          if set(changed_keys) != selected:
              raise SystemExit(f"changed-key mismatch: {sorted(changed_keys)}")

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate all institutional contracts on Python 3.11
        run: |
          python scripts/validate_institutional_registry.py
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06
          python -m unittest -v tests.test_institutional_registry_wave07
          python -m unittest -v tests.test_institutional_registry_wave08
          python -m unittest -v tests.test_institutional_registry_wave09
          python -m unittest -v tests.test_institutional_registry_wave10
          python -m unittest -v tests.test_institutional_registry_wave11

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all institutional contracts on Python 3.12
        run: |
          python scripts/validate_institutional_registry.py
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06
          python -m unittest -v tests.test_institutional_registry_wave07
          python -m unittest -v tests.test_institutional_registry_wave08
          python -m unittest -v tests.test_institutional_registry_wave09
          python -m unittest -v tests.test_institutional_registry_wave10
          python -m unittest -v tests.test_institutional_registry_wave11

      - name: Assert exact Wave 11 post-state
        shell: python
        run: |
          import csv
          from pathlib import Path
          with Path("data/reference/ORGANIZATIONS.csv").open("r", encoding="utf-8", newline="") as f:
              organizations = list(csv.DictReader(f, delimiter=";"))
          with Path("data/reference/ORGANIZATION_SCOPE_ROLES.csv").open("r", encoding="utf-8", newline="") as f:
              roles = list(csv.DictReader(f, delimiter=";"))
          validated = sum(r["VALIDATION_STATUS"] == "VALIDATED" for r in roles)
          pending = sum(r["VALIDATION_STATUS"] == "PENDING" for r in roles)
          pending_exchange = sum(r["VALIDATION_STATUS"] == "PENDING" and r["ROLE_CODE"] == "STOCK_EXCHANGE" for r in roles)
          print("ORGANIZATIONS", len(organizations))
          print("ROLE_ROWS", len(roles))
          print("VALIDATED", validated)
          print("PENDING", pending)
          print("PENDING_STOCK_EXCHANGE", pending_exchange)
          assert len(organizations) == 141
          assert len(roles) == 199
          assert validated == 174
          assert pending == 25
          assert pending_exchange == 0

      - name: Guard exact changed-file scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "data/reference/ORGANIZATION_SCOPE_ROLES.csv"

      - name: Commit only the governed role registry
        run: |
          set -euo pipefail
          git config user.name "openfunds-governed-ci"
          git config user.email "openfunds-governed-ci@users.noreply.github.com"
          git add data/reference/ORGANIZATION_SCOPE_ROLES.csv
          git diff --cached --check
          git commit -m "feat(source): promote Wave 11 verified exchange roles"
          git push origin HEAD:architecture/africafunds-country-indicators-v0.1
