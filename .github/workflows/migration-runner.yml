name: Governed Migration Runner

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'schemas/**'
      - 'data/indicator_catalog/**'
      - 'scripts/run_migrations.py'
      - 'scripts/generate_validated_fx_reference_sql.py'
      - 'scripts/generate_country_indicator_catalog.py'
      - 'tests/test_migration_runner.py'
      - 'tests/test_country_indicator_catalog.py'
      - 'tests/test_fund_domain_model.py'
      - 'tests/sql/fund_domain_model_assert.sql'
      - '.github/workflows/migration-runner.yml'
  push:
    paths:
      - 'migrations/**'
      - 'schemas/**'
      - 'data/indicator_catalog/**'
      - 'scripts/run_migrations.py'
      - 'scripts/generate_validated_fx_reference_sql.py'
      - 'scripts/generate_country_indicator_catalog.py'
      - 'tests/test_migration_runner.py'
      - 'tests/test_country_indicator_catalog.py'
      - 'tests/test_fund_domain_model.py'
      - 'tests/sql/fund_domain_model_assert.sql'
      - '.github/workflows/migration-runner.yml'
  workflow_dispatch:

jobs:
  governed-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfunds
          POSTGRES_PASSWORD: openfunds
          POSTGRES_DB: openfunds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfunds -d openfunds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openfunds:openfunds@localhost:5432/openfunds
      PGPASSWORD: openfunds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: >-
          python -m unittest -v
          tests.test_migration_runner
          tests.test_country_indicator_catalog
          tests.test_fund_domain_model

      - name: Validate and display governed plan
        run: python scripts/run_migrations.py --plan

      - name: Apply to an empty PostgreSQL 16 database
        run: |
          python scripts/run_migrations.py --apply
          python scripts/run_migrations.py --apply
          python scripts/run_migrations.py --verify

      - name: Assert governed runtime contract
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
              migration_count integer;
              indicator_domain_count integer;
              indicator_definition_count integer;
              raw_count integer;
              metadata_count integer;
              event_count integer;
              calculated_count integer;
              invalid_history_count integer;
          begin
              select count(*) into migration_count
              from openfunds_migration.schema_migration;
              if migration_count <> 16 then
                  raise exception 'expected 16 governed migrations, got %', migration_count;
              end if;
              if to_regclass('source.endpoint') is null then
                  raise exception 'canonical source.endpoint is missing';
              end if;
              if to_regclass('source.source_endpoint') is not null then
                  raise exception 'excluded proposal table source.source_endpoint was created';
              end if;
              if to_regclass('market.fx_observation') is null then
                  raise exception 'market.fx_observation is missing';
              end if;
              if not exists (
                  select 1 from information_schema.columns
                  where table_schema='ref'
                    and table_name='entity_relationship'
                    and column_name='valid_from_status'
              ) then
                  raise exception 'business-date status contract is missing';
              end if;
              if to_regclass('fund.entity') is null
                 or to_regclass('fund.current_share_class_path') is null
                 or to_regclass('fund.structure_quality_issue') is null then
                  raise exception 'canonical fund domain objects are missing';
              end if;
              if to_regclass('fund.fund') is not null
                 or to_regclass('fund.share_class') is not null then
                  raise exception 'legacy draft fund tables were activated';
              end if;

              if to_regclass('ref.indicator_domain') is null
                 or to_regclass('ref.indicator_definition') is null then
                  raise exception 'country indicator catalogue runtime tables are missing';
              end if;
              select count(*) into indicator_domain_count from ref.indicator_domain;
              select count(*) into indicator_definition_count from ref.indicator_definition;
              if indicator_domain_count <> 18 then
                  raise exception 'expected 18 indicator domains, got %', indicator_domain_count;
              end if;
              if indicator_definition_count <> 420 then
                  raise exception 'expected 420 indicator definitions, got %', indicator_definition_count;
              end if;

              select count(*) filter (where canonical_nature='RAW'),
                     count(*) filter (where canonical_nature='METADATA'),
                     count(*) filter (where canonical_nature='EVENT'),
                     count(*) filter (where canonical_nature='CALCULATED')
                into raw_count, metadata_count, event_count, calculated_count
              from ref.indicator_definition;
              if raw_count <> 298 or metadata_count <> 85
                 or event_count <> 7 or calculated_count <> 30 then
                  raise exception 'canonical nature counts drift: RAW %, METADATA %, EVENT %, CALCULATED %',
                      raw_count, metadata_count, event_count, calculated_count;
              end if;

              select count(*) into invalid_history_count
              from ref.indicator_definition
              where history_status <> 'NOT_ASSERTED_BY_DEFINITION_CATALOGUE';
              if invalid_history_count <> 0 then
                  raise exception 'definition catalogue asserted loaded history for % rows', invalid_history_count;
              end if;

              if not exists (
                  select 1 from ref.indicator_definition
                  where indicator_code='D00.SOURCE_HASH'
                    and source_nature='Brute'
                    and canonical_nature='METADATA'
                    and classification_decision_id='OF-DATA-003-A'
              ) then
                  raise exception 'source_nature/canonical_nature separation contract is missing';
              end if;
          end
          $$;
          SQL

      - name: Validate Fund SubFund ShareClass fixtures
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f tests/sql/fund_domain_model_assert.sql

      - name: Adopt an already initialized database without a ledger
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "drop schema openfunds_migration cascade"
          python scripts/run_migrations.py --apply
          python scripts/run_migrations.py --verify
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f tests/sql/fund_domain_model_assert.sql
