name: Frozen Migration 012 Guard

on:
  push:
    branches: [architecture/africafunds-country-indicators-v0.1]
    paths:
      - 'scripts/generate_validated_fx_reference_sql.py'
      - 'migrations/manifest.json'
      - 'migrations/sources/012_validated_fx_reference_registry.csv'
      - 'schemas/reference/012_validated_fx_reference_registry.sql'
      - '.github/workflows/freeze-migration-012.yml'
  pull_request:
    paths:
      - 'scripts/generate_validated_fx_reference_sql.py'
      - 'migrations/manifest.json'
      - 'migrations/sources/012_validated_fx_reference_registry.csv'
      - 'schemas/reference/012_validated_fx_reference_registry.sql'
      - '.github/workflows/freeze-migration-012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check immutable generated migration
        run: |
          before="$(sha256sum schemas/reference/012_validated_fx_reference_registry.sql)"
          python scripts/generate_validated_fx_reference_sql.py --check
          after="$(sha256sum schemas/reference/012_validated_fx_reference_registry.sql)"
          test "$before" = "$after"
          test "$before" = "fb1e82536717082092e762706f29d51dd834dd5b2f0ea1b10193665f9f48bda0  schemas/reference/012_validated_fx_reference_registry.sql"
