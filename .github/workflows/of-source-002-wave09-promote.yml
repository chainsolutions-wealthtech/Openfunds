name: OF-SOURCE-002 Wave 09 Zone Role Promotion

on:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - ".github/workflows/of-source-002-wave09-promote.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: of-source-002-wave09-zone-role-promotion
  cancel-in-progress: false

jobs:
  promote-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: architecture/africafunds-country-indicators-v0.1
          fetch-depth: 0

      - name: Promote only four exact existing zone roles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/reference/ORGANIZATION_SCOPE_ROLES.csv")
          targets = {
              ("BCEAO", "CENTRAL_BANK", "UEMOA", "MONETARY_ZONE"): "OFFICIAL_ZONE_ROLE_VERIFIED_2026_08_17_BCEAO",
              ("BEAC", "CENTRAL_BANK", "CEMAC", "MONETARY_ZONE"): "OFFICIAL_ZONE_ROLE_VERIFIED_2026_08_17_BEAC",
              ("BRVM", "COMMON_STOCK_EXCHANGE", "UEMOA", "MONETARY_ZONE"): "OFFICIAL_ZONE_ROLE_VERIFIED_2026_08_17_BRVM",
              ("BVMAC", "COMMON_STOCK_EXCHANGE", "CEMAC", "MONETARY_ZONE"): "OFFICIAL_ZONE_ROLE_VERIFIED_2026_08_17_BVMAC",
          }

          raw = path.read_text(encoding="utf-8")
          lines = raw.splitlines()
          header = lines[0]
          output = [header]
          seen = set()
          changed = 0

          for line in lines[1:]:
              if not line:
                  output.append(line)
                  continue
              parts = line.split(";")
              if len(parts) != 10:
                  raise SystemExit(f"Unexpected registry column count {len(parts)}: {line}")
              key = (parts[0], parts[1], parts[2], parts[3])
              if key in targets:
                  if key in seen:
                      raise SystemExit(f"Duplicate exact Wave 09 relationship: {key}")
                  seen.add(key)
                  if parts[8] not in {"PENDING", "VALIDATED"}:
                      raise SystemExit(f"Unexpected pre-status for {key}: {parts[8]}")
                  if parts[8] == "PENDING":
                      parts[8] = "VALIDATED"
                      parts[9] = targets[key]
                      changed += 1
                  elif parts[9] != targets[key]:
                      raise SystemExit(f"Already VALIDATED with unexpected source note for {key}: {parts[9]}")
                  line = ";".join(parts)
              output.append(line)

          missing = set(targets) - seen
          if missing:
              raise SystemExit(f"Missing exact Wave 09 relationships: {sorted(missing)}")
          if changed not in {0, 4}:
              raise SystemExit(f"Partial Wave 09 promotion detected: changed={changed}")

          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Wave 09 exact promotions applied: {changed}")
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate all institutional contracts on Python 3.11
        run: |
          python scripts/validate_institutional_registry.py --check
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06
          python -m unittest -v tests.test_institutional_registry_wave07
          python -m unittest -v tests.test_institutional_registry_wave08
          python -m unittest -v tests.test_institutional_registry_wave09

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all institutional contracts on Python 3.12
        run: |
          python scripts/validate_institutional_registry.py --check
          python -m unittest -v tests.test_institutional_registry
          python -m unittest -v tests.test_institutional_registry_wave05
          python -m unittest -v tests.test_institutional_registry_wave06
          python -m unittest -v tests.test_institutional_registry_wave07
          python -m unittest -v tests.test_institutional_registry_wave08
          python -m unittest -v tests.test_institutional_registry_wave09

      - name: Assert exact post-state
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          path = Path("data/reference/ORGANIZATION_SCOPE_ROLES.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter=";"))
          status = Counter(row["VALIDATION_STATUS"] for row in rows)
          assert len(rows) == 199, len(rows)
          assert status == Counter({"VALIDATED": 159, "PENDING": 40}), status
          targets = {
              ("BCEAO", "CENTRAL_BANK", "UEMOA", "MONETARY_ZONE"),
              ("BEAC", "CENTRAL_BANK", "CEMAC", "MONETARY_ZONE"),
              ("BRVM", "COMMON_STOCK_EXCHANGE", "UEMOA", "MONETARY_ZONE"),
              ("BVMAC", "COMMON_STOCK_EXCHANGE", "CEMAC", "MONETARY_ZONE"),
          }
          validated = {
              (r["ORGANIZATION_CODE"], r["ROLE_CODE"], r["SCOPE_ENTITY_CODE"], r["SCOPE_ENTITY_TYPE"])
              for r in rows if r["VALIDATION_STATUS"] == "VALIDATED"
          }
          assert targets <= validated
          print("Wave 09 post-state verified: 199 roles / 159 VALIDATED / 40 PENDING")
          PY

      - name: Commit only the governed role registry
        shell: bash
        run: |
          if git diff --quiet -- data/reference/ORGANIZATION_SCOPE_ROLES.csv; then
            echo "No Wave 09 promotion change to commit"
            exit 0
          fi
          git status --short
          unexpected_files="$(git status --short | awk '$2 != "data/reference/ORGANIZATION_SCOPE_ROLES.csv" {count++} END {print count+0}')"
          test "$unexpected_files" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/ORGANIZATION_SCOPE_ROLES.csv
          git commit -m "data(source): validate UEMOA CEMAC central banks and exchanges"
          git push origin HEAD:architecture/africafunds-country-indicators-v0.1
