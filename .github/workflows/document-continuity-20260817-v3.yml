name: Documentation Continuity Reconciliation 2026-08-17 V3

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - ".github/workflows/document-continuity-20260817-v3.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/africafunds-country-indicators-v0.1
          fetch-depth: 0
      - name: Reconcile permanent project documents with verified state
        shell: python
        run: |
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding="utf-8")
              if text.count(old) != 1: raise SystemExit(f"marker count {text.count(old)} in {path}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1),encoding="utf-8",newline="\n")

          replace_once("TODO.md","Dernière mise à jour : `2026-08-12`.","Dernière mise à jour : `2026-08-17`.")
          replace_once("TODO.md","- **Progression vérifiée au 2026-08-12 :** vague 01 terminée et testée ; 55 organisations dont 35 `VALIDATED`, 92 relations organisation-rôle dont 48 `VALIDATED`, 10/54 pays avec au moins une organisation country-scoped, 44 pays restant sans organisation nationale.\n- **Preuves :** `docs/00_PROJECT/OF_SOURCE_002_BASELINE_AUDIT_20260812.md`, `docs/00_PROJECT/OF_SOURCE_002_WAVE_01_COMPLETION_20260812.md`, workflow `Institutional Registry` run `31592700354` `SUCCESS` sur Python 3.11/3.12.\n- **Prochaine unité :** `WAVE_02` en lecture seule ; rechercher les 44 pays non couverts et compléter les rôles manquants des 10 pays déjà présents avant toute nouvelle allowlist.\n- **Limite :** les CSV restent des inventaires de découverte/revue selon ADR-021 ; aucune persistance runtime n’est revendiquée.","- **Progression vérifiée au 2026-08-17 :** Waves 01 à 09 exécutées sous contrats TDD ; 141 organisations dont 121 `VALIDATED`, 199 relations organisation-rôle dont 159 `VALIDATED`, 53/54 pays avec au moins une organisation country-scoped ; `ERYTHREE` reste volontairement non peuplée faute de source primaire officielle actuelle vérifiée.\n- **Preuves :** rapports `OF_SOURCE_002_*`, tests `tests/test_institutional_registry*.py`, workflow `Institutional Registry`, audit `scripts/audit_institutional_role_coverage.py` et promotions zonales Wave 09.\n- **Prochaine unité :** réduire les groupes de rôles encore manquants à partir de l’audit effectif pays+zones, en promouvant d’abord les lignes `PENDING` déjà présentes lorsqu’une preuve primaire officielle existe ; conserver les cas non applicables ou insuffisamment prouvés explicites.\n- **Limite :** couverture 53/54 ne signifie pas complétude de tous les rôles ; les CSV restent des surfaces gouvernées de découverte/revue et la production persistante reste séparée.")
          replace_once("TODO.md","## OF-TAX-001 — Peupler les classes et sous-classes\n\n- **Statut :** DECIDE_NON_IMPLEMENTE","## OF-TAX-001 — Peupler les classes et sous-classes\n\n- **Statut :** TERMINE")
          replace_once("TODO.md","- **Critères d'acceptation :** Actions, Obligations CT/MT/LT, Diversifié Prudent/Equilibré/Dynamique/Flexible, Monétaire, seeds idempotents et tests.\n\n## OF-TAX-002 — Générer catégories et sous-catégories\n\n- **Statut :** PROPOSE","- **Critères d'acceptation :** Actions, Obligations CT/MT/LT, Diversifié Prudent/Equilibré/Dynamique/Flexible, Monétaire, seeds idempotents et tests.\n- **Résultat vérifié 2026-08-17 :** 4 classes, 7 sous-classes, snapshot source figé, générateur SQL déterministe, migration gouvernée `017_CANONICAL_FUND_TAXONOMY_V0_1` ordre 170, PostgreSQL 16 GREEN et seconde application 100 % idempotente.\n- **Preuve :** `docs/00_PROJECT/OF_TAX_001_002_RUNTIME_PERSISTENCE_COMPLETION_20260817.md`.\n\n## OF-TAX-002 — Générer catégories et sous-catégories\n\n- **Statut :** TERMINE")
          replace_once("TODO.md","- **Critères d'acceptation :** national/régional/Afrique, codes déterministes, parentés, historisation et absence de doublon.\n\n## OF-BENCH-001","- **Critères d'acceptation :** national/régional/Afrique, codes déterministes, parentés, historisation et absence de doublon.\n- **Résultat vérifié 2026-08-17 :** structure V0.1 déterministe déjà testée à 486 routages et 432 catégories/blocs de référence ; persistance PostgreSQL gouvernée par migration 017. Les objets restent `STRUCTURE_PREFILLED` / `NOT_ACTIVE` : activation, séries et méthodologies demeurent hors de cette clôture.\n\n## OF-BENCH-001")
          replace_once("TODO.md","- **Dépendances :** version officielle exploitable, licence, OF-DATA-002","- **Dépendances :** Field List officiel v2.13.0 archivé sans modification, OF-DATA-002")
          replace_once("TODO.md","- **Livrables :** source archivée et catalogue structuré.\n\n## OF-MAP-002","- **Livrables :** source archivée et catalogue structuré.\n- **Etat vérifié 2026-08-17 :** version officielle `2.13.0` et licence `CC BY-ND 4.0` vérifiées ; manifeste de provenance créé. Le seul gate primaire restant est l'archivage exact du Field List officiel v2.13.0, son SHA256 et son parsing déterministe.\n\n## OF-MAP-002")

          # Remove trailing hard-break spaces only on the updated line to satisfy git diff --check.
          replace_once("SUIVI.md","Dernière mise à jour : `2026-08-12`  \n","Dernière mise à jour : `2026-08-17`\n")
          replace_once("SUIVI.md","ORGANISATIONS ET SOURCES                 OF-SOURCE-002 EN_COURS / 10 PAYS COUNTRY-SCOPED SUR 54","ORGANISATIONS ET SOURCES                 OF-SOURCE-002 EN_COURS / 53 PAYS COUNTRY-SCOPED SUR 54")
          replace_once("SUIVI.md","MODELE FUND/SUBFUND/SHARECLASS           VERIFIED_COMPLETE\nDICTIONNAIRE MACHINE-READABLE            FUND CORE + D00-D17 GOUVERNES\nMAPPING OPENFUNDS                        BLOQUE CATALOGUE OFFICIEL\nCATEGORIES / BLOCS DE REFERENCE          STRUCTURE PRESENTE / NON ACTIVE","MODELE FUND/SUBFUND/SHARECLASS           VERIFIED_COMPLETE\nDICTIONNAIRE MACHINE-READABLE            FUND CORE + D00-D17 GOUVERNES\nMAPPING OPENFUNDS                        V2.13.0/LICENCE VERIFIES / FIELD LIST A ARCHIVER\nTAXONOMIE POSTGRESQL                     MIGRATION 017 VERIFIED_COMPLETE / NOT_ACTIVE\nCATEGORIES / BLOCS DE REFERENCE          486 ROUTAGES / 432 BLOCS / NON ACTIFS")
          p=Path("SUIVI.md"); t=p.read_text(encoding="utf-8"); marker="## 2. REALISATIONS\n"
          block="""## 1.1 MISE A JOUR VERIFIEE — 2026-08-17\n\n### Couverture institutionnelle\n\n```text\nCOUNTRY_COVERAGE: 53 / 54\nORGANIZATIONS: 141 = 121 VALIDATED + 20 PENDING\nORGANIZATION_SCOPE_ROLES: 199 = 159 VALIDATED + 40 PENDING\nUNCOVERED_COUNTRY: ERYTHREE\nWAVES_VERIFIED: 01..09\n```\n\nL'Érythrée reste volontairement sans organisation country-scoped tant qu'aucune source primaire officielle actuelle n'est vérifiée. BCEAO, BEAC, BRVM et BVMAC restent modélisées à leur scope zonal et ont été promues sans duplication dans Wave 09.\n\n### Taxonomie canonique et PostgreSQL\n\n`OF-TAX-001` et la génération structurelle `OF-TAX-002` V0.1 sont désormais persistées par `017_CANONICAL_FUND_TAXONOMY_V0_1`, ordre 170. La migration est générée depuis un snapshot V0.1 figé ; Python 3.11/3.12, PostgreSQL 16, la chaîne 001→017, le ledger et la seconde application idempotente sont vérifiés.\n\n```text\nASSET_CLASSES: 4\nASSET_SUBCLASSES: 7\nCOUNTRY_ROUTING_ROWS: 54\nCATEGORY_TEMPLATES: 9\nREFERENCE_OVERRIDES: 11\nANALYTICS_REQUIREMENTS: 25\nEXPANDED_ROUTING_RULES: 486\nCATEGORY_REFERENCE_BLOCKS: 432\nCANONICAL_STATUS: STRUCTURE_PREFILLED\nPRODUCTION_STATUS: NOT_ACTIVE\n```\n\nPreuve : `docs/00_PROJECT/ADR-029_CANONICAL_TAXONOMY_AUTHORING_AND_RUNTIME.md` et `docs/00_PROJECT/OF_TAX_001_002_RUNTIME_PERSISTENCE_COMPLETION_20260817.md`.\n\n### Openfunds\n\nLa version `2.13.0` et la licence officielle `CC BY-ND 4.0` sont vérifiées. `OF-MAP-001` reste incomplet uniquement tant que le Field List officiel exact n'est pas archivé sans modification, hashé et parsé.\n\n"""
          if t.count(marker)!=1: raise SystemExit("SUIVI marker mismatch")
          p.write_text(t.replace(marker,block+marker,1),encoding="utf-8",newline="\n")

          replace_once("CHANGELOG.md","- version officielle Openfunds à intégrer et sa licence ;","- archivage exact et parsing déterministe du Field List officiel Openfunds v2.13.0 (version et licence déjà vérifiées) ;")
          p=Path("CHANGELOG.md"); t=p.read_text(encoding="utf-8"); marker="## [2026-08-12] — OF-SOURCE-002 VAGUE 01 — COUVERTURE INSTITUTIONNELLE\n"
          block="""## [2026-08-17] — TAXONOMIE POSTGRESQL, OPENFUNDS ET COUVERTURE INSTITUTIONNELLE\n\n### Taxonomie\n\n- générateur SQL déterministe et migration `017_CANONICAL_FUND_TAXONOMY_V0_1` ordre 170 ;\n- snapshot source V0.1 immuable avec SHA-256 ;\n- 4 classes, 7 sous-classes, 54 routages, 9 templates, 11 overrides, 25 exigences analytiques ;\n- Python 3.11/3.12 GREEN ;\n- PostgreSQL 16 : chaîne 001→017, ledger, contrat runtime et seconde application idempotente GREEN ;\n- run `Canonical Taxonomy Migration` `32058160324` SUCCESS ;\n- ADR-029 et rapport de clôture ajoutés ;\n- statuts fonctionnels conservés : `STRUCTURE_PREFILLED` / `NOT_ACTIVE`.\n\n### OF-SOURCE-002\n\n- Waves 02 à 09 poursuivies sous TDD ;\n- 53/54 pays country-scoped, 141 organisations, 199 relations organisation-rôle, 159 `VALIDATED` ;\n- BCEAO/BEAC/BRVM/BVMAC promus sur scope zonal sans duplication ;\n- Érythrée volontairement non peuplée sans preuve primaire officielle actuelle.\n\n### Openfunds\n\n- v2.13.0 et licence `CC BY-ND 4.0` vérifiées ;\n- manifeste de provenance ajouté ;\n- Field List exact, SHA256 et parser restent le gate OF-MAP-001.\n\n### Non activé\n\n- aucun WTI/WTI Bench live, aucun benchmark/RFR/MAR promu, aucune production persistante, aucun merge/retargeting/déploiement/main mutation.\n\n"""
          if t.count(marker)!=1: raise SystemExit("CHANGELOG marker mismatch")
          p.write_text(t.replace(marker,block+marker,1),encoding="utf-8",newline="\n")

          p=Path("DECISIONS.md"); t=p.read_text(encoding="utf-8")
          block="""## ADR-029 — AUTHORING ET PERSISTANCE RUNTIME DE LA TAXONOMIE CANONIQUE\n\n- **Statut :** ACCEPTE\n- **Date :** 2026-08-17\n- **Décision :** `data/canonical/` reste la surface d'authoring/revue ; une release de migration fige un snapshot immuable ; le SQL est généré déterministement ; PostgreSQL devient la source de vérité runtime après application gouvernée.\n- **Migration :** `017_CANONICAL_FUND_TAXONOMY_V0_1`, ordre 170.\n- **Statut conservé :** `STRUCTURE_PREFILLED` / `NOT_ACTIVE`.\n- **Preuve :** `docs/00_PROJECT/ADR-029_CANONICAL_TAXONOMY_AUTHORING_AND_RUNTIME.md`.\n- **Règle :** 017 n'est jamais réécrite après application ; toute évolution est une nouvelle version + forward migration.\n"""
          if "## ADR-029 — AUTHORING ET PERSISTANCE RUNTIME DE LA TAXONOMIE CANONIQUE" not in t:
              p.write_text(t.rstrip()+"\n\n"+block.strip()+"\n",encoding="utf-8",newline="\n")

          replace_once("data/canonical/README.md","SOURCE SQL MAITRE : NON DECIDEE","PERSISTANCE RUNTIME : MIGRATION 017 GOUVERNEE / POSTGRESQL 16 VERIFIE")
          p=Path("data/canonical/README.md"); t=p.read_text(encoding="utf-8")
          anchor="Les objets sont préremplis sur le plan structurel. Cela ne signifie pas que toutes les séries de marché, tous les taux sans risque ou toutes les méthodologies de benchmark sont déjà validés.\n"
          add="\nDepuis le 2026-08-17, cette structure est persistée de manière gouvernée par `017_CANONICAL_FUND_TAXONOMY_V0_1`. Les fichiers de ce répertoire restent la surface d'authoring/revue ; un snapshot immuable alimente le générateur SQL et PostgreSQL devient la vérité runtime après application. Cette persistance **n'active pas** les templates : `CANONICAL_STATUS=STRUCTURE_PREFILLED` et `PRODUCTION_STATUS=NOT_ACTIVE` restent obligatoires.\n"
          if t.count(anchor)!=1: raise SystemExit(f"canonical anchor count {t.count(anchor)}")
          p.write_text(t.replace(anchor,anchor+add,1),encoding="utf-8",newline="\n")

      - name: Guard documentation-only scope and whitespace
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//')
          expected=(CHANGELOG.md DECISIONS.md SUIVI.md TODO.md data/canonical/README.md)
          test "${#changed[@]}" -eq 5
          for file in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx "$file"; done
          git add "${expected[@]}"
          git diff --cached --check
      - name: Commit reconciled permanent documentation
        run: |
          set -euo pipefail
          git config user.name "openfunds-governed-ci"
          git config user.email "openfunds-governed-ci@users.noreply.github.com"
          git commit -m "docs(project): reconcile verified 2026-08-17 state"
          git push origin HEAD:architecture/africafunds-country-indicators-v0.1
