name: Canonical Taxonomy Migration

on:
  workflow_dispatch:
  push:
    branches:
      - architecture/africafunds-country-indicators-v0.1
    paths:
      - "data/canonical/**"
      - "migrations/sources/017_canonical_taxonomy_v0_1/**"
      - "scripts/generate_canonical_taxonomy_sql.py"
      - "scripts/run_migrations.py"
      - "schemas/taxonomy/017_canonical_fund_taxonomy_v0_1.sql"
      - "migrations/manifest.json"
      - "tests/test_generate_canonical_taxonomy_sql.py"
      - "tests/test_canonical_taxonomy_postgres.py"
      - ".github/workflows/canonical-taxonomy-migration.yml"
  pull_request:
    paths:
      - "data/canonical/**"
      - "migrations/sources/017_canonical_taxonomy_v0_1/**"
      - "scripts/generate_canonical_taxonomy_sql.py"
      - "scripts/run_migrations.py"
      - "schemas/taxonomy/017_canonical_fund_taxonomy_v0_1.sql"
      - "migrations/manifest.json"
      - "tests/test_generate_canonical_taxonomy_sql.py"
      - "tests/test_canonical_taxonomy_postgres.py"
      - ".github/workflows/canonical-taxonomy-migration.yml"

permissions:
  contents: read

jobs:
  unit:
    name: taxonomy-generator (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run taxonomy SQL generator contract
        run: python -m unittest -v tests.test_generate_canonical_taxonomy_sql
      - name: Verify frozen migration 017 from frozen source snapshot
        run: |
          python scripts/generate_canonical_taxonomy_sql.py \
            --check \
            --source-dir migrations/sources/017_canonical_taxonomy_v0_1 \
            --output schemas/taxonomy/017_canonical_fund_taxonomy_v0_1.sql
      - name: Verify governed migration plan includes 017
        run: |
          python scripts/run_migrations.py --plan | tee /tmp/migration-plan.txt
          grep -F "170 PENDING 017_CANONICAL_FUND_TAXONOMY_V0_1" /tmp/migration-plan.txt

  postgres:
    name: taxonomy-postgres-16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://openfunds:openfunds@localhost:5432/openfunds
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfunds
          POSTGRES_PASSWORD: openfunds
          POSTGRES_DB: openfunds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfunds -d openfunds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply governed migrations 001 through 017
        run: python scripts/run_migrations.py --apply --database-url "$DATABASE_URL"

      - name: Verify governed migration ledger
        run: python scripts/run_migrations.py --verify --database-url "$DATABASE_URL"

      - name: Run PostgreSQL taxonomy contract after first apply
        run: python -m unittest -v tests.test_canonical_taxonomy_postgres

      - name: Apply governed migrations a second time
        run: python scripts/run_migrations.py --apply --database-url "$DATABASE_URL" | tee /tmp/second-apply.txt

      - name: Assert second apply is idempotent
        run: |
          grep -F "SKIP 170 017_CANONICAL_FUND_TAXONOMY_V0_1" /tmp/second-apply.txt
          test "$(grep -c '^SKIP ' /tmp/second-apply.txt)" -eq 17
          ! grep -q '^APPLY ' /tmp/second-apply.txt

      - name: Verify governed ledger after second apply
        run: python scripts/run_migrations.py --verify --database-url "$DATABASE_URL"

      - name: Re-run PostgreSQL taxonomy contract after second apply
        run: python -m unittest -v tests.test_canonical_taxonomy_postgres
